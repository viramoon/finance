# finance 组件接口。服务部署以 fertile/deploy 为唯一准绳。
version: 2
system: fertile
component: finance
status: component-reference
deployment_source: "viramoon/fertile:deploy/service.yaml"
profile: cloudbox # FERTILE_PROFILE 选择 cloudbox 或 stable
environment:
  FERTILE_PROFILE: cloudbox # 部署环境，与运行模式独立
  FERTILE_DATA_ROOT: /home/box/fertile/data # 配置默认，实际从配置读取
  IB_GATEWAY_ADDRESS: "127.0.0.1:4002"
paths:
  root: /home/box/fertile # 配置默认
  catalog: /home/box/fertile/data/catalog
  state: /home/box/fertile/data/finance-state
  logs: /home/box/fertile/logs/finance
repository_data_policy:
  runtime_data_outside_worktree: true
  docs: docs/data-guard.md
  rules: .data-guard/rules.json # 暂存读取 HEAD，推送读取远端跟踪默认分支，PR 读取基分支 SHA
  fixture_sources: .data-guard/sources.json
  published_history: .data-guard/published.json
dependencies:
  ib_gateway:
    host: 127.0.0.1
    client_ids: {probe: 91, collector: 92, trader: 93}
    paper_port: 4002
    account: paper
  parquet_catalog:
    path_from: config.paths.catalog
  node_state:
    backend: TBD # Nautilus 缓存与恢复状态持久化，不能依赖 web 在线
processes:
  - name: trader
    command: TBD # 待节点入口实现
    port: TBD # 待健康端口分配
    mode: Live
    account: paper
    dependencies: [ib_gateway, parquet_catalog, node_state]
    health:
      path: /healthz
      live: 进程存活
      ready: Gateway 认证、行情新鲜、订阅恢复且对账可信
    restart_policy: TBD # 由 fertile 运维设计确认
  - name: collector
    command: finance-collector
    working_directory: finance
    port: 8082
    dependencies: [parquet_catalog, data_root]
    source: replay
    source_config_env: FINANCE_COLLECTOR_CONFIG
    source_configs:
      replay: config/collector/cloudbox.yaml
      ib: config/collector/ib-cloudbox.yaml
      ib-delayed: config/collector/ib-delayed.yaml
    catalog_isolation: 每种数据源分配独立的 FERTILE_DATA_ROOT，API 读取该源的根目录
    health:
      live_path: /healthz/live
      ready_path: /healthz/ready
      status_path: /status
    restart_policy: fertile deploy/
  - name: finance-binance
    command: finance-binance
    working_directory: finance
    python_path: python
    config_env: FINANCE_BINANCE_CONFIG
    profiles: {cloudbox: config/binance/cloudbox.yaml, stable: config/binance/stable.yaml}
    enabled_by_default: false
    dependencies: [data_root, nautilus_source_wheel]
    output: finance-state/market-wal
    health: JSON 状态日志，403/451 为 region_restricted
    restart_policy: 仅失败重启，由 fertile deploy/ 决定是否启用
  - name: finance-hyperliquid
    command: finance-hyperliquid config/collector/hyperliquid.yaml
    working_directory: finance
    python_path: python
    python_env: FINANCE_PYTHON
    activation: fertile deploy/ 显式启用并提供已审核产品许可配置
    dependencies: [data_root, nautilus_source_wheel]
    product: hyperliquid/perp-public
    output: finance-state/market-wal/hyperliquid/perp-public # 仅当 record_local 为 true
    health: 记录模式通过 finance-market-wal watermarks 和 quality 核对
    documentation: docs/integrations/hyperliquid.md
    restart_policy: fertile deploy/
  - name: finance-projector
    command: 'python -m fertile_finance.market_projector --data-root "$FERTILE_DATA_ROOT" --wal-bin finance-market-wal'
    working_directory: finance
    python_path: python
    dependencies: [data_root, nautilus_source_wheel, finance-market-wal]
    input: finance-state/market-wal
    state: finance-state/market-projection
    output: catalog/market-events
    health: 由本地 finance-market-wal watermarks 检查投影进度
    restart_policy: fertile deploy/
  - name: backtest-worker
    command: scripts/finance-backtest-worker
    working_directory: finance
    dependencies: [data_root, nautilus_source_wheel]
    queue: finance-state/backtests/jobs.sqlite3
    lease_seconds_env: FINANCE_WORKER_LEASE_SECONDS # 默认 15 秒
    replicas: 同一宿主的本地 SQLite 作业队列可供多个 worker 共享
    strategy_bundle:
      replay_inputs: finance-state/backtests/strategy-inputs
      pinned_inputs: strategy_backtest_snapshots
      indicator_command: finance-strategy evaluate-indicators
      indicator_bin_env: FINANCE_STRATEGY_BIN
      mode: offline_backtest
    health: 监测 worker 进程和最近作业的终态
    restart_policy: fertile deploy/
  - name: finance-decision
    command: scripts/finance-decision
    working_directory: finance
    required_args: [--plan, --replay]
    follow_arg: --follow
    data_root_env: FERTILE_DATA_ROOT
    interpreter_env: FINANCE_PYTHON # 默认 python3
    dependencies: [data_root, approved_decision_replay]
    replay_formats:
      sma_crossover: f1_event_ndjson
      strategy_bundle: decision_session_ndjson # 使用源码构建的 Python 环境
    strategy_bundle:
      indicator_command: finance-strategy evaluate-indicators
      indicator_bin_env: FINANCE_STRATEGY_BIN
    state: finance-state/decisions/decisions.sqlite3
    health: 监测进程状态与持久消费进度
    restart_policy: fertile deploy/
  - name: api
    command: cargo run --release --locked -p finance-api # 开发启动；部署产物命令由 fertile 定义
    working_directory: finance # 需可读取 config/，或设 FINANCE_CONFIG_DIR
    bind_host: 127.0.0.1
    port: 8081 # FINANCE_API_PORT / config.api.port 可覆盖
    dependencies: [data_root]
    query_routes:
      bars: /api/v1/market/bars
      indicator_registry: /api/v1/indicators
      indicator_values: /api/v1/indicators/values
    bars_query_projection: "${FERTILE_DATA_ROOT}/finance-state/bars/v1"
    read_contract:
      version: v1
      documentation: docs/api.md
      market_state: [finance-state/market-wal, finance-state/market-projection]
      factor_snapshot: finance-state/factor-research/read-v1.json
      strategy_routes:
        validate: 'POST /api/v1/strategies/validate'
        register: 'POST /api/v1/strategies'
        versions: 'GET /api/v1/strategies'
        version: 'GET /api/v1/strategies/{id}/versions/{version}'
      backtest_routes:
        detail: 'GET /api/v1/backtests/{id}'
        cancel: 'POST /api/v1/backtests/{id}/cancel'
        worker_status: 'GET /api/v1/backtests/worker-status'
      factor_report: 'GET /api/v1/factors/{id}/evaluations/{evaluation_id}'
      decision_signals:
        route: 'GET /api/v1/decisions/signals'
        database: finance-state/decisions/decisions.sqlite3
        publication: finance-state/decisions/read-v1.json
        access: published_plan_with_local_recording_and_non_display_derivation
        sma_license_proof: sma_replay_license
      local_state_paths: 数据根以下的目录和文件禁止使用符号链接
      cache_control: private, no-store
      openapi_export: cargo run --locked -q -p finance-api -- export-openapi
      stream_schema_export: cargo run --locked -q -p finance-api -- export-read-stream DIRECTORY
    health:
      live_path: /healthz/live
      ready_path: /healthz/ready
      live: 进程存活
      ready: 数据根目录可读；不代表交易 ready
    restart_policy: 由 fertile deploy/ 的守护配置决定
batch_jobs:
  - name: ib-market-entitlements
    command: bash scripts/check-ib-entitlements.sh
    working_directory: finance
    dependencies: [ib_gateway]
    account: paper
    opt_in_env: IB_LIVE_TEST
    client_id_from: ib.probe_client_id
    output: 脱敏 JSON 到标准输出
  - name: backtest-sample
    command: bash scripts/backtest-sample.sh
    output: "${FERTILE_DATA_ROOT}/finance-state/backtests/sample/latest.json"
    mode: Backtest
  - name: historical-pull
    command: PYTHONPATH=python "${FINANCE_PYTHON}" -m fertile_finance.historical_pull
    working_directory: finance
    invocation: 按需运行，需 --allow-download，Binance 另需 --enable-binance
    dependencies: [data_root, nautilus_source_wheel]
    data_root: --data-root 或 FERTILE_DATA_ROOT，显式绝对路径且在 Git 工作树之外
    output: "${FERTILE_DATA_ROOT}/catalog/historical"
    state: "${FERTILE_DATA_ROOT}/finance-state/historical"
    ibkr: 使用 paper 只读 Gateway 和 probe client ID
    binance_enabled_by_default: false
offline_research:
  factor_evaluation: fertile_finance.factor_evaluation.evaluate_factor
  factor_lifecycle: fertile_finance.research_catalog.FactorResearchCatalog
  historical_registration: strategies/registry/factor-momentum-v1.json
  invocation: local_python_library
  documentation: docs/factor-research.md
option_exposure:
  invocation: in_process_rust_library
  input: option_chain_snapshot
  persistence: disabled
  documentation: docs/option-exposure.md
option_flow:
  invocation: in_process_rust_library
  account: paper_read_only
  live: finance_collector::option_flow::LiveOptionFlow
  historical: finance_collector::option_flow::OptionHistoryIngress
  activation: 共享行情接入方显式提供产品许可与历史查询时窗
  observation: memory_only
  history_product: ibkr/opra-history
  historical_wal: finance-state/market-wal/ibkr/opra-history # 仅经许可记录
  documentation: docs/option-flow.md
ib_line_budget:
  invocation: in_process_rust_library
  runner: finance_collector::line_budget::LineScheduler::run_paper
  account: paper_read_only
  l1_defaults: {account: 100, stock: 9, hot_options: 16, rotating_options: 45, reserve: 30}
  depth_defaults: {pinned: 2, page_focus: 1}
  coverage: memory_only
  documentation: docs/integrations/ib-line-budget.md
nasdaq_totalview:
  invocation: in_process_rust_library
  account: paper_read_only
  activation: 由共享行情所有者接入，启用前核对综合股票 L1、TotalView-OpenView 和 EDS
  concurrent_depth: {pinned: 2, page_focus: 1}
  output: private_session_display
  persistence: disabled
  documentation: docs/integrations/ib.md#nasdaq-totalview-场所深度
library_interfaces:
  option_history:
    entry: finance_collector::option_history
    ibkr: f9a_verified_paper_market
    pacing_state: finance-state/historical # 与 F11 共用数据根
    databento_opra: disabled_without_estimate_config
    databento_network: false
    documentation: docs/option-history.md
runbook: RUNBOOK.md
