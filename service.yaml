# finance 组件接口。服务部署以 fertile/deploy 为唯一准绳。
version: 2
system: fertile
component: finance
status: component-reference
deployment_source: "viramoon/fertile:deploy/service.yaml"
profile: cloudbox # FERTILE_PROFILE 选择 cloudbox 或 stable
environment:
  FERTILE_PROFILE: cloudbox # 部署环境，与运行模式独立
  FERTILE_DATA_ROOT: /home/box/fertile/data # 配置默认，实际从配置读取
  IB_GATEWAY_ADDRESS: "127.0.0.1:4002"
paths:
  root: /home/box/fertile # 配置默认
  catalog: /home/box/fertile/data/catalog
  state: /home/box/fertile/data/finance-state
  logs: /home/box/fertile/logs/finance
dependencies:
  ib_gateway:
    host: 127.0.0.1
    client_ids: {probe: 91, collector: 92, trader: 93}
    paper_port: 4002
    account: paper
  parquet_catalog:
    path_from: config.paths.catalog
  node_state:
    backend: TBD # Nautilus 缓存与恢复状态持久化，不能依赖 web 在线
processes:
  - name: trader
    command: TBD # 待节点入口实现
    port: TBD # 待健康端口分配
    mode: Live
    account: paper
    dependencies: [ib_gateway, parquet_catalog, node_state]
    health:
      path: /healthz
      live: 进程存活
      ready: Gateway 认证、行情新鲜、订阅恢复且对账可信
    restart_policy: TBD # 由 fertile 运维设计确认
  - name: collector
    command: finance-collector
    working_directory: finance
    port: 8082
    dependencies: [parquet_catalog, data_root]
    source: replay
    source_config_env: FINANCE_COLLECTOR_CONFIG
    source_configs:
      replay: config/collector/cloudbox.yaml
      ib: config/collector/ib-cloudbox.yaml
      ib-delayed: config/collector/ib-delayed.yaml
    catalog_isolation: 每种数据源分配独立的 FERTILE_DATA_ROOT，API 读取该源的根目录
    health:
      live_path: /healthz/live
      ready_path: /healthz/ready
      status_path: /status
    restart_policy: fertile deploy/
  - name: backtest-worker
    command: scripts/finance-backtest-worker
    working_directory: finance
    dependencies: [data_root, nautilus_source_wheel]
    queue: finance-state/backtests/jobs.sqlite3
    health: 监测 worker 进程和最近作业的终态
    restart_policy: fertile deploy/
  - name: api
    command: cargo run --release --locked -p finance-api # 开发启动；部署产物命令由 fertile 定义
    working_directory: finance # 需可读取 config/，或设 FINANCE_CONFIG_DIR
    bind_host: 127.0.0.1
    port: 8081 # FINANCE_API_PORT / config.api.port 可覆盖
    dependencies: [data_root]
    health:
      live_path: /healthz/live
      ready_path: /healthz/ready
      live: 进程存活
      ready: 数据根目录可读；不代表交易 ready
    restart_policy: 由 fertile deploy/ 的守护配置决定
batch_jobs:
  - name: backtest-sample
    command: bash scripts/backtest-sample.sh
    output: "${FERTILE_DATA_ROOT}/finance-state/backtests/sample/latest.json"
    mode: Backtest
  - name: historical-pull
    command: PYTHONPATH=python "${FINANCE_PYTHON}" -m fertile_finance.historical_pull
    working_directory: finance
    invocation: 按需运行，需 --allow-download，Binance 另需 --enable-binance
    dependencies: [data_root, nautilus_source_wheel]
    data_root: --data-root 或 FERTILE_DATA_ROOT，显式绝对路径且在 Git 工作树之外
    output: "${FERTILE_DATA_ROOT}/catalog/historical"
    state: "${FERTILE_DATA_ROOT}/finance-state/historical"
    ibkr: 使用 paper 只读 Gateway 和 probe client ID
    binance_enabled_by_default: false
runbook: RUNBOOK.md
