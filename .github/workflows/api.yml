name: Finance API
on:
  push:
    branches: [ha-runthrough]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 检查 PR 引入的 Git 对象
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B scripts/data_guard.py range "$BASE_SHA" HEAD
      - name: 读取锁定工具链
        id: versions
        run: |
          source toolchain.env
          echo "rust=$RUST_VERSION" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.versions.outputs.rust }}
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: api-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 核对 OpenAPI 与版本化流契约导出
        run: |
          cargo run --locked -q -p finance-api -- export-openapi > "$RUNNER_TEMP/finance.openapi.json"
          cargo run --locked -q -p finance-api -- export-openapi > "$RUNNER_TEMP/finance.second.json"
          cmp "$RUNNER_TEMP/finance.openapi.json" "$RUNNER_TEMP/finance.second.json"
          cargo run --locked -q -p finance-api -- export-read-stream "$RUNNER_TEMP/finance-read-stream"
          cargo run --locked -q -p finance-api -- export-read-stream "$RUNNER_TEMP/finance-read-stream-second"
          for name in market-ws.schema.json market-status-sse.schema.json read-stream-examples.json; do
            cmp "$RUNNER_TEMP/finance-read-stream/$name" "$RUNNER_TEMP/finance-read-stream-second/$name"
            cmp "$RUNNER_TEMP/finance-read-stream/$name" "protocol/v1/$name"
          done
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: finance-openapi
          path: ${{ runner.temp }}/finance.openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: finance-read-stream-v1
          path: ${{ runner.temp }}/finance-read-stream/
