name: Repository Data Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  data-guard:
    name: Repository Data Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: 检查 PR 引入的 Git 对象
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B scripts/data_guard.py range "$BASE_SHA" HEAD
      - name: 离线验证钩子与 CI 拒绝行为
        run: python3 -B -m unittest discover -s tests -p test_data_guard.py -v
