[package]
name = "finance-api"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "signal"] }
utoipa = { version = "5", features = ["chrono"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
