[package]
name = "finance-api"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "finance-api"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
finance-collector = { path = "../finance-collector" }
finance-ib = { path = "../finance-ib" }
finance-market-protocol = { path = "../finance-market-protocol" }
num-bigint-dig = { version = "0.8.6", default-features = false, features = ["u64_digit"] }
num-integer = "0.1.47"
num-traits = "0.2"
regex = "1"
rust_decimal = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml = "0.9"
sha2 = "0.10"
rustix = { version = "1.1", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "signal"] }
unsafe-libyaml = "0.2"
utoipa = { version = "5", features = ["chrono"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
