[package]
name = "finance-collector"
version = "0.0.0"
edition = "2024"
publish = false
default-run = "finance-collector"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["macros","rt-multi-thread","signal","net","time","process","io-util","sync"] }
finance-ib = { path = "../finance-ib" }
finance-market-protocol = { path = "../finance-market-protocol" }
ibapi = "=3.2.0"
rust_decimal = "1"
rustix = { version = "1.1", features = ["fs"] }
sha2 = "0.10"
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
utoipa = "5"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
