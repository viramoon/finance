[project]
name = "fertile-finance"
version = "0.0.0"
description = "fertile finance 的 Nautilus 源码构建与回测作业"
requires-python = ">=3.12,<3.13"
dependencies = ["nautilus-trader", "exchange-calendars==4.13.3"]

[tool.uv]
package = false
required-version = "==0.11.33"

[tool.uv.sources]
nautilus-trader = { path = "vendor/nautilus_trader" }

[dependency-groups]
build = [
  "cython==3.2.9",
  "poetry-core==2.3.1",
  "setuptools>=83",
  "packaging>=25",
]
research = ["scipy", "statsmodels"]
